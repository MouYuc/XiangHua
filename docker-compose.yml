services:
  XiangHua:
    image: xianghua:local
    container_name: XiangHua
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - GPT_SOVITS_ROOT=/workspace/GPT-SoVITS
      - XIANGHUA_SERVER_NAME=0.0.0.0
      - XIANGHUA_SERVER_PORT=7860
    ports:
      - "7860:7860"
    volumes:
      # 复用本机 GPT-SoVITS 的底模、训练数据与个人训练产物
      - ./GPT-SoVITS/GPT_SoVITS/pretrained_models:/workspace/GPT-SoVITS/GPT_SoVITS/pretrained_models
      - ./GPT-SoVITS/GPT_SoVITS/text/G2PWModel:/workspace/GPT-SoVITS/GPT_SoVITS/text/G2PWModel
      - ./GPT-SoVITS/custom_data:/workspace/GPT-SoVITS/custom_data
      - ./GPT-SoVITS/GPT_weights_v2Pro:/workspace/GPT-SoVITS/GPT_weights_v2Pro
      - ./GPT-SoVITS/SoVITS_weights_v2Pro:/workspace/GPT-SoVITS/SoVITS_weights_v2Pro
      # WebUI 配置与历史记录
      - ./.guangpu_webui:/workspace/.guangpu_webui
      # 合成结果（浏览器可直接试听和下载）
      - ./output:/workspace/output
    working_dir: /workspace
    command: ["python", "/workspace/frontend_only_launcher.py"]
