name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# A new push to the same branch cancels the previous run: the old result can no
# longer be trusted and CI minutes are the scarce resource here.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install "ruff>=0.16,<0.17"
      - run: ruff check backend tools scripts

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install -r requirements-ci.txt
      - name: Run the suite
        # test_gpt_sovits_mixed_language_patch imports torch at module scope and
        # needs the vendored engine tree, neither of which exists in CI. It is
        # covered by the local full-environment run instead.
        #
        # Coverage is reported, not gated: the project has no agreed baseline yet,
        # and a threshold picked before that would either block refactors or be
        # meaningless. See docs/REFACTOR_2026-11.md §7.
        run: >
          python -m pytest -q
          --ignore=backend/tests/test_gpt_sovits_mixed_language_patch.py
          --cov=backend --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      # `build` runs vue-tsc --noEmit first, so this also enforces type-checking.
      - run: npm run build
