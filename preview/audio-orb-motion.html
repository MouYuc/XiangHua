<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Audio Orb Motion Preview</title>
  <style>
    :root { color-scheme: dark; font-family: "Microsoft YaHei", system-ui, sans-serif; background: #08110f; color: #e8f3eb; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at 50% 42%, #14352d 0, #08110f 48%, #050908 100%); }
    main { width: min(920px, calc(100vw - 32px)); }
    .top { display: flex; justify-content: space-between; align-items: end; gap: 24px; margin-bottom: 14px; }
    .eyebrow { color: #83bea0; font: 700 11px/1 Consolas, monospace; letter-spacing: .16em; }
    h1 { margin: 9px 0 0; font-size: clamp(25px, 4vw, 42px); letter-spacing: 0; }
    .note { max-width: 340px; color: #98b3a3; font-size: 13px; line-height: 1.6; text-align: right; }
    .stage { position: relative; overflow: hidden; border: 1px solid #315b4b; border-radius: 18px; background: linear-gradient(145deg, rgba(20, 57, 46, .92), rgba(7, 19, 16, .96)); box-shadow: 0 24px 80px rgba(0, 0, 0, .35), inset 0 0 60px rgba(76, 170, 131, .06); }
    canvas { display: block; width: 100%; height: min(64vw, 560px); min-height: 390px; }
    .hud { position: absolute; inset: 20px 22px auto; display: flex; justify-content: space-between; pointer-events: none; }
    .state { display: grid; gap: 7px; }
    .state strong { font-size: 21px; }
    .state small { color: #95b8a3; }
    .counter { color: #9dcab1; font: 700 13px Consolas, monospace; }
    .controls { display: flex; flex-wrap: wrap; gap: 8px; padding: 14px; border-top: 1px solid rgba(122, 185, 151, .2); }
    button { min-height: 36px; border: 1px solid #507e68; border-radius: 8px; padding: 7px 13px; color: #e8f3eb; background: #17372d; cursor: pointer; }
    button:hover, button.active { border-color: #9edcba; background: #2a6650; }
    button.primary { color: #07110c; border-color: #aee86d; background: #aee86d; font-weight: 700; }
    .legend { display: flex; flex-wrap: wrap; gap: 16px; padding: 0 14px 14px; color: #94ac9d; font-size: 12px; }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .legend i { width: 8px; height: 8px; display: inline-block; border-radius: 50%; background: #4cba88; }
    .legend .loose i { background: #87b79e; }
    .legend .done i { background: #4e9cff; }
    @media (max-width: 640px) { .top { display: block; }.note { margin-top: 10px; text-align: left; }.hud { inset: 15px; } canvas { min-height: 360px; }.state strong { font-size: 17px; } }
  </style>
</head>
<body>
  <main>
    <div class="top">
      <div><div class="eyebrow">XIANGHUA / VISUAL PROTOTYPE</div><h1>粒子球合成过程预览</h1></div>
      <div class="note">这里刻意不依赖真实合成速度，用一段可观察的动画确认视觉方向。</div>
    </div>
    <section class="stage">
      <canvas id="orb" aria-label="粒子球散开、左到右填充、完成收束预览"></canvas>
      <div class="hud"><div class="state"><div class="eyebrow" id="phase">IDLE</div><strong id="title">等待合成</strong><small id="detail">点击开始预览</small></div><div class="counter" id="counter">0 / 1</div></div>
      <div class="controls">
        <button class="primary" id="play">开始预览</button>
        <button data-mode="explode">只看散开</button>
        <button data-mode="fill">只看左到右填充</button>
        <button data-mode="done">只看完成收束</button>
      </div>
      <div class="legend"><span><i></i>已填充粒子</span><span class="loose"><i></i>待填充散点</span><span class="done"><i></i>完成蓝色粒子球</span></div>
    </section>
  </main>
  <script>
    const canvas = document.getElementById('orb');
    const ctx = canvas.getContext('2d');
    const phaseEl = document.getElementById('phase');
    const titleEl = document.getElementById('title');
    const detailEl = document.getElementById('detail');
    const counterEl = document.getElementById('counter');
    const playButton = document.getElementById('play');
    const particles = [];
    const TAU = Math.PI * 2;
    let width = 0;
    let height = 0;
    let current = 'idle';
    let progress = 1;
    let from = 0;
    let startedAt = 0;
    let auto = false;

    function randomSphere() {
      const y = Math.random() * 2 - 1;
      const angle = Math.random() * TAU;
      const radius = Math.sqrt(1 - y * y);
      return { x: Math.cos(angle) * radius, y, z: Math.sin(angle) * radius };
    }
    for (let i = 0; i < 620; i += 1) {
      const sphere = randomSphere();
      const burst = 1.35 + Math.random() * 1.35;
      particles.push({
        sphere,
        loose: { x: sphere.x * burst + (Math.random() - .5) * .35, y: sphere.y * burst + (Math.random() - .5) * .35, z: sphere.z * burst },
        twinkle: Math.random() * TAU,
        size: .7 + Math.random() * 1.5
      });
    }
    function resize() {
      const ratio = Math.min(window.devicePixelRatio || 1, 2);
      width = canvas.clientWidth;
      height = canvas.clientHeight;
      canvas.width = Math.floor(width * ratio);
      canvas.height = Math.floor(height * ratio);
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    }
    function setMode(mode) {
      auto = false;
      current = mode;
      progress = mode === 'done' ? 1 : mode === 'fill' ? 0 : 0;
      from = performance.now();
      updateHud();
    }
    function start() {
      auto = true;
      current = 'explode';
      progress = 0;
      startedAt = performance.now();
      from = startedAt;
      playButton.textContent = '重新播放';
      updateHud();
    }
    function updateHud() {
      const labels = {
        idle: ['IDLE', '等待合成', '点击开始预览'],
        explode: ['EXPLODE', '粒子散开', '所有粒子离开球心'],
        fill: ['FILL', '从左向右填充', '蓝色声场正在形成'],
        done: ['DONE', '完成收束', '蓝色粒子球已就绪']
      };
      const label = labels[current];
      phaseEl.textContent = label[0];
      titleEl.textContent = label[1];
      detailEl.textContent = label[2];
      counterEl.textContent = Math.round(progress * 100) + ' / 100';
      document.querySelectorAll('[data-mode]').forEach(button => button.classList.toggle('active', button.dataset.mode === current));
    }
    function project(point, spin) {
      const x = point.x * Math.cos(spin) - point.z * Math.sin(spin);
      const z = point.x * Math.sin(spin) + point.z * Math.cos(spin);
      const depth = 1 / (3.5 - z);
      return { x: width * .5 + x * width * .19 * depth, y: height * .53 + point.y * height * .36 * depth, depth };
    }
    function draw(time) {
      const elapsed = time - from;
      if (auto) {
        if (current === 'explode' && elapsed > 900) { current = 'fill'; from = time; }
        if (current === 'fill') progress = Math.min(1, elapsed / 5200);
        if (current === 'fill' && progress >= 1) { current = 'done'; from = time; }
        if (current === 'done' && elapsed > 1800) auto = false;
        updateHud();
      } else if (current === 'fill') {
        progress = Math.min(1, elapsed / 5200);
      }
      ctx.clearRect(0, 0, width, height);
      const spin = time * .00025;
      const front = -1 + progress * 2;
      const pulse = current === 'explode' ? 1 + Math.sin(time * .006) * .04 : 1;
      const sorted = particles.slice().sort((a, b) => a.sphere.z - b.sphere.z);
      for (const particle of sorted) {
        const isFilled = current === 'idle' || current === 'done' || (current === 'fill' && particle.sphere.x <= front);
        const chargingBand = current === 'fill' && Math.abs(particle.sphere.x - front) < .085;
        const source = current === 'explode' ? particle.loose : particle.sphere;
        const point = project({ x: source.x * pulse, y: source.y * pulse, z: source.z * pulse }, spin);
        const alpha = current === 'explode' ? .72 : current === 'done' ? .98 : isFilled ? .92 : .28;
        const color = current === 'done' ? '78, 156, 255' : current === 'fill' && isFilled ? '72, 190, 255' : current === 'fill' ? '92, 132, 142' : '74, 194, 139';
        const radius = particle.size * (1.2 + point.depth * 1.8) * (chargingBand ? 1.7 : 1);
        if (chargingBand) {
          ctx.save();
          ctx.shadowColor = 'rgba(102, 220, 255, .95)';
          ctx.shadowBlur = 14;
        }
        ctx.beginPath();
        ctx.fillStyle = 'rgba(' + color + ', ' + alpha + ')';
        ctx.arc(point.x, point.y, radius, 0, TAU);
        ctx.fill();
        if (chargingBand) ctx.restore();
      }
      requestAnimationFrame(draw);
    }
    window.addEventListener('resize', resize);
    playButton.addEventListener('click', start);
    document.querySelectorAll('[data-mode]').forEach(button => button.addEventListener('click', () => setMode(button.dataset.mode)));
    resize();
    updateHud();
    requestAnimationFrame(draw);
  </script>
</body>
</html>
